name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and publish
        required: true
        type: string

env:
  UV_FROZEN: "true"

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccr_test
          POSTGRES_PASSWORD: ccr_test
          POSTGRES_DB: growth_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccr_test -d growth_release"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CCR_TEST_POSTGRES_URL: postgresql://ccr_test:ccr_test@localhost:5432/growth_release
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Require an existing published version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: uv sync --all-extras
      - name: Match package version to release tag
        run: uv run python -c "import ccr, os; assert 'v' + ccr.__version__ == os.environ['RELEASE_TAG']"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python -m compileall -q src tests
      - run: uv run pytest
      - run: uv run python scripts/check_schema_registry.py
      - run: uv run ccr optimizer growth-example --json
      - name: Safety-critical coverage gate
        run: >-
          uv run pytest -q
          tests/test_runtime_p0_p1_hardening.py
          tests/test_optimizer.py
          tests/test_growth.py
          tests/test_distributed_collective_protocol.py
          tests/test_task_state_machine.py
          tests/test_task_leasing.py
          tests/test_provider_api_v1.py
          tests/test_phase_engine_v1.py
          tests/test_safety_failure_branches.py
          tests/test_storage_sqlite.py
          tests/test_v140_runtime_scalability.py
          --cov=ccr.optimizer
          --cov=ccr.storage.control
          --cov=ccr.tasks.lease
          --cov=ccr.tasks.lifecycle
          --cov=ccr.residuals.lifecycle
          --cov=ccr.operations.approval
          --cov=ccr.operations.verifier
          --cov=ccr.workcells.protocol
          --cov=ccr.experiments.protocol
          --cov=ccr.storage.local_store
          --cov=ccr.storage.sqlite
          --cov=ccr.providers.http
          --cov=ccr.phase.eligibility
          --cov-report=term
          --cov-fail-under=90
      - run: uv run ccr schema validate --kind packet --file examples/minimal/packet.json
      - run: uv run ccr schema validate --kind task --file examples/minimal/task.json
      - run: uv run ccr schema validate --kind packet --file examples/phase_formation/packets/checked/packet.phase.seed.json
      - run: uv run ccr schema validate --kind packet --file examples/phase_formation/packets/checked/packet.phase.integrator.json
      - run: uv run ccr schema validate --kind packet --file examples/phase_formation/packets/candidate/packet.phase.duplicate.json
      - run: uv run ccr schema validate --kind baseline --file examples/phase_formation/baseline.json
      - run: uv run ccr schema validate --kind asi-proxy-threshold --file examples/phase_formation/threshold.json
      - run: uv run ccr schema validate --kind trc-operation-plan --file examples/asi_proxy_benchmark_bundle/trc_operation_plan.json
      - run: cp -R examples/phase_formation /tmp/ccr-phase-formation && uv run ccr --root /tmp/ccr-phase-formation phase form --profile development --json
      - run: uv run ccr audit repo --json
      - run: uv build
      - run: uv run ccr audit release --dist dist --json
      - run: uvx twine check dist/*
      - name: Preserve exact distribution checksums
        run: |
          mkdir -p release-records
          sha256sum dist/* > release-records/SHA256SUMS
      - name: Check installed offline paths outside checkout
        run: |
          uv venv /tmp/ccr-installed
          uv pip install --python /tmp/ccr-installed/bin/python dist/*.whl cryptography
          cd /tmp
          /tmp/ccr-installed/bin/ccr optimizer growth-example --json
          /tmp/ccr-installed/bin/ccr agent explain --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-checksums
          path: release-records/
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kadubon/percolation-inversion-compiler
          ref: 83ca785e5ab79fe8c546c92474b4b03321fdc04c # PIC v1.0.0
          path: .tmp/pic-root
          persist-credentials: false
      - run: uv run ccr audit pic --pic-root .tmp/pic-root --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/collective-capability-runtime
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-assets:
    name: Attach verified distributions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-checksums
          path: release-records/
      - name: Attach the built distributions without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          sha256sum --check release-records/SHA256SUMS
          gh release upload "$RELEASE_TAG" dist/* release-records/SHA256SUMS
